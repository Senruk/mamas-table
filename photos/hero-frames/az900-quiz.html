<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AZ-900 Practice Quiz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg:        #080d1a;
  --surface:   #0f1929;
  --card:      #141f35;
  --border:    #1e3054;
  --azure:     #39a0ed;
  --azure-dim: #1a6fa8;
  --text:      #e2e8f0;
  --muted:     #64748b;
  --correct:   #22c55e;
  --wrong:     #ef4444;
  --amber:     #f59e0b;
}

html { font-size: 16px; }

body {
  font-family: 'JetBrains Mono', monospace;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  line-height: 1.6;
}

/* ─── HEADER ─── */
header {
  position: sticky;
  top: 0;
  z-index: 50;
  background: rgba(8,13,26,0.85);
  backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--border);
  padding: 0.75rem 1.5rem;
  display: flex;
  align-items: center;
  gap: 1rem;
  flex-wrap: wrap;
}

header .logo {
  font-family: 'Sora', sans-serif;
  font-weight: 800;
  font-size: 1rem;
  color: var(--azure);
  letter-spacing: 0.04em;
  white-space: nowrap;
}

header .logo span {
  color: var(--text);
  font-weight: 400;
}

.header-stats {
  display: flex;
  gap: 1.25rem;
  flex-wrap: wrap;
  margin-left: auto;
}

.stat {
  text-align: center;
  min-width: 3.5rem;
}

.stat .num {
  font-family: 'Sora', sans-serif;
  font-size: 1.25rem;
  font-weight: 700;
  color: var(--text);
  display: block;
  line-height: 1.2;
}

.stat .lbl {
  font-size: 0.6rem;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: 0.08em;
}

.stat.correct .num { color: var(--correct); }
.stat.wrong   .num { color: var(--wrong); }

/* ─── CONTROLS BAR ─── */
.controls {
  padding: 0.75rem 1.5rem;
  display: flex;
  gap: 0.5rem;
  align-items: center;
  flex-wrap: wrap;
  border-bottom: 1px solid var(--border);
}

.ctrl-label {
  font-size: 0.65rem;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: 0.08em;
  margin-right: 0.25rem;
}

.domain-btn {
  background: transparent;
  border: 1px solid var(--border);
  color: var(--muted);
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.7rem;
  padding: 0.3rem 0.75rem;
  border-radius: 4px;
  cursor: pointer;
  transition: all 0.2s ease;
}

.domain-btn:hover {
  border-color: var(--azure);
  color: var(--azure);
}

.domain-btn.active {
  background: var(--azure);
  border-color: var(--azure);
  color: #000;
  font-weight: 500;
}

.mode-toggle {
  display: flex;
  gap: 0.25rem;
  margin-left: auto;
}

.mode-btn {
  background: transparent;
  border: 1px solid var(--border);
  color: var(--muted);
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.7rem;
  padding: 0.3rem 0.75rem;
  border-radius: 4px;
  cursor: pointer;
  transition: all 0.2s ease;
}

.mode-btn.active {
  background: var(--azure-dim);
  border-color: var(--azure);
  color: var(--text);
}

/* ─── MAIN LAYOUT ─── */
main {
  max-width: 860px;
  margin: 0 auto;
  padding: 2rem 1.5rem 4rem;
}

/* ─── QUESTION CARD ─── */
.question-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 10px;
  overflow: hidden;
  margin-bottom: 1.5rem;
}

.q-meta {
  display: flex;
  align-items: center;
  gap: 0.75rem;
  padding: 0.9rem 1.25rem;
  border-bottom: 1px solid var(--border);
  background: var(--surface);
}

.q-number {
  font-family: 'Sora', sans-serif;
  font-size: 0.7rem;
  font-weight: 600;
  color: var(--azure);
  background: rgba(57,160,237,0.1);
  border: 1px solid rgba(57,160,237,0.25);
  padding: 0.2rem 0.55rem;
  border-radius: 4px;
  white-space: nowrap;
}

.q-domain {
  font-size: 0.65rem;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: 0.07em;
}

.q-text {
  font-family: 'Sora', sans-serif;
  font-size: clamp(0.95rem, 2vw, 1.08rem);
  font-weight: 600;
  color: var(--text);
  padding: 1.4rem 1.25rem 1.25rem;
  line-height: 1.55;
}

.options {
  padding: 0 1.25rem 1.5rem;
  display: flex;
  flex-direction: column;
  gap: 0.6rem;
}

.option {
  display: flex;
  align-items: flex-start;
  gap: 0.75rem;
  padding: 0.85rem 1rem;
  border: 1px solid var(--border);
  border-radius: 7px;
  cursor: pointer;
  transition: all 0.18s ease;
  position: relative;
}

.option:hover:not(.locked) {
  border-color: var(--azure);
  background: rgba(57,160,237,0.05);
}

.option .letter {
  font-family: 'Sora', sans-serif;
  font-weight: 700;
  font-size: 0.75rem;
  color: var(--azure);
  background: rgba(57,160,237,0.1);
  border: 1px solid rgba(57,160,237,0.25);
  width: 1.75rem;
  height: 1.75rem;
  border-radius: 4px;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  transition: all 0.18s ease;
}

.option .opt-text {
  font-size: 0.88rem;
  color: var(--text);
  line-height: 1.5;
  padding-top: 0.05rem;
}

/* States after answering */
.option.correct {
  border-color: var(--correct);
  background: rgba(34,197,94,0.08);
}
.option.correct .letter {
  background: var(--correct);
  border-color: var(--correct);
  color: #000;
}
.option.correct .opt-text { color: var(--correct); }

.option.wrong {
  border-color: var(--wrong);
  background: rgba(239,68,68,0.08);
}
.option.wrong .letter {
  background: var(--wrong);
  border-color: var(--wrong);
  color: #fff;
}
.option.wrong .opt-text { color: var(--wrong); }

.option.reveal-correct {
  border-color: var(--correct);
  background: rgba(34,197,94,0.05);
}
.option.reveal-correct .letter {
  background: rgba(34,197,94,0.15);
  border-color: rgba(34,197,94,0.4);
  color: var(--correct);
}
.option.reveal-correct .opt-text { color: var(--text); }

.option.locked {
  cursor: default;
  opacity: 0.75;
}
.option.locked:not(.correct):not(.wrong):not(.reveal-correct) {
  opacity: 0.5;
}

/* Multi-select badge */
.multi-badge {
  font-size: 0.6rem;
  color: var(--amber);
  background: rgba(245,158,11,0.1);
  border: 1px solid rgba(245,158,11,0.3);
  padding: 0.15rem 0.45rem;
  border-radius: 3px;
  margin-left: auto;
  white-space: nowrap;
}

/* ─── FEEDBACK PANEL ─── */
.feedback {
  margin: 0 1.25rem 1.5rem;
  padding: 0.9rem 1rem;
  border-radius: 7px;
  font-size: 0.82rem;
  display: none;
  line-height: 1.55;
}

.feedback.show { display: block; }

.feedback.pass {
  background: rgba(34,197,94,0.08);
  border: 1px solid rgba(34,197,94,0.25);
  color: var(--correct);
}

.feedback.fail {
  background: rgba(239,68,68,0.08);
  border: 1px solid rgba(239,68,68,0.25);
  color: var(--wrong);
}

/* ─── ANSWERED INDICATOR ─── */
.answered-bar {
  padding: 0 1.25rem;
  margin-bottom: 1.5rem;
  display: flex;
  align-items: center;
  gap: 0.4rem;
  flex-wrap: wrap;
}

.dot {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  background: var(--border);
  cursor: pointer;
  transition: all 0.15s ease;
  border: 1px solid transparent;
}

.dot:hover { border-color: var(--azure); transform: scale(1.2); }

.dot.answered-correct { background: var(--correct); }
.dot.answered-wrong   { background: var(--wrong); }
.dot.current          { border-color: var(--text); transform: scale(1.3); }

/* ─── NAV BUTTONS ─── */
.nav-row {
  display: flex;
  gap: 0.75rem;
  flex-wrap: wrap;
}

.btn {
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.8rem;
  padding: 0.65rem 1.25rem;
  border-radius: 6px;
  cursor: pointer;
  border: 1px solid;
  transition: all 0.2s ease;
  display: inline-flex;
  align-items: center;
  gap: 0.4rem;
}

.btn-primary {
  background: var(--azure);
  border-color: var(--azure);
  color: #000;
  font-weight: 500;
}
.btn-primary:hover { background: #5bb3f5; border-color: #5bb3f5; }
.btn-primary:disabled { opacity: 0.35; cursor: default; }

.btn-ghost {
  background: transparent;
  border-color: var(--border);
  color: var(--muted);
}
.btn-ghost:hover { border-color: var(--azure); color: var(--azure); }

/* ─── RESULTS SCREEN ─── */
.results {
  text-align: center;
  padding: 3rem 1.5rem;
}

.results h2 {
  font-family: 'Sora', sans-serif;
  font-size: 2rem;
  font-weight: 800;
  margin-bottom: 0.5rem;
}

.results .big-score {
  font-family: 'Sora', sans-serif;
  font-size: 5rem;
  font-weight: 800;
  line-height: 1;
  margin: 1.5rem 0;
}

.results .big-score.pass { color: var(--correct); }
.results .big-score.fail { color: var(--wrong); }

.results .score-sub {
  font-size: 0.85rem;
  color: var(--muted);
  margin-bottom: 2rem;
}

.results-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
  gap: 1rem;
  max-width: 560px;
  margin: 0 auto 2.5rem;
  text-align: center;
}

.res-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 1rem 0.75rem;
}

.res-card .rc-num {
  font-family: 'Sora', sans-serif;
  font-size: 1.8rem;
  font-weight: 700;
  display: block;
  line-height: 1.2;
}

.res-card .rc-lbl {
  font-size: 0.65rem;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: 0.07em;
}

.res-card.correct-card .rc-num { color: var(--correct); }
.res-card.wrong-card   .rc-num { color: var(--wrong); }
.res-card.skipped-card .rc-num { color: var(--amber); }

.restart-btn {
  font-family: 'Sora', sans-serif;
  font-size: 1rem;
  font-weight: 600;
  background: var(--azure);
  border: none;
  color: #000;
  padding: 0.85rem 2rem;
  border-radius: 7px;
  cursor: pointer;
  transition: background 0.2s;
}
.restart-btn:hover { background: #5bb3f5; }

/* ─── JUMP TO QUESTION ─── */
.jump-modal {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.7);
  z-index: 100;
  align-items: center;
  justify-content: center;
  padding: 1rem;
}
.jump-modal.open { display: flex; }

.jump-box {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 1.5rem;
  width: 100%;
  max-width: 440px;
  max-height: 80vh;
  overflow-y: auto;
}

.jump-box h3 {
  font-family: 'Sora', sans-serif;
  font-size: 0.95rem;
  font-weight: 700;
  margin-bottom: 1rem;
  color: var(--text);
}

.jump-grid {
  display: grid;
  grid-template-columns: repeat(10, 1fr);
  gap: 0.35rem;
}

.jn {
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.7rem;
  padding: 0.3rem 0.1rem;
  border-radius: 4px;
  text-align: center;
  cursor: pointer;
  border: 1px solid var(--border);
  color: var(--muted);
  background: transparent;
  transition: all 0.15s;
}

.jn:hover { border-color: var(--azure); color: var(--azure); }
.jn.correct { background: rgba(34,197,94,0.15); border-color: rgba(34,197,94,0.4); color: var(--correct); }
.jn.wrong   { background: rgba(239,68,68,0.15);  border-color: rgba(239,68,68,0.4);  color: var(--wrong); }
.jn.current { border-color: var(--azure); color: var(--azure); font-weight: 700; }

.jump-close {
  margin-top: 1rem;
  width: 100%;
  background: transparent;
  border: 1px solid var(--border);
  color: var(--muted);
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.75rem;
  padding: 0.5rem;
  border-radius: 5px;
  cursor: pointer;
}
.jump-close:hover { border-color: var(--text); color: var(--text); }

/* ─── FILTER BLANK STATE ─── */
.blank {
  text-align: center;
  padding: 4rem 1rem;
  color: var(--muted);
  font-size: 0.85rem;
}

/* ─── RESPONSIVE ─── */
@media (max-width: 600px) {
  header { padding: 0.6rem 1rem; gap: 0.75rem; }
  .header-stats { gap: 0.75rem; }
  main { padding: 1.25rem 1rem 3rem; }
  .q-text { padding: 1.1rem 1rem 1rem; font-size: 0.95rem; }
  .options { padding: 0 1rem 1.25rem; }
  .nav-row { flex-direction: column; }
  .btn { justify-content: center; }
}
</style>
</head>

</div>

<main id="mainArea">

</main>

<!-- Results -->
<div id="resultsScreen" style="display:none">

  </div>
</div>

<!-- Jump Modal -->
<div class="jump-modal" id="jumpModal">

    <h3>Jump to Question</h3>
    <div class="jump-grid" id="jumpGrid"></div>
    <button class="jump-close" id="jumpClose">Cancel</button>

</div>

const state = {
  questions: [],
  current: 0,
  answered: {},      // index → 'correct' | 'wrong'
  correctCount: 0,
  wrongCount: 0,
  filterDomain: 'all',
  mode: 'practice',  // 'practice' | 'exam'
  submitted: false
};

// ─── INIT ───────────────────────────────────────────────────────────────────
function init() {
  state.questions = DATA.questions;
  buildDomainButtons();
  applyFilter();
  renderBar();
  setupMode();
}

// ─── DOM REFS ────────────────────────────────────────────────────────────────
const $ = id => document.getElementById(id);
const qCard      = $('questionCard');
const qNumber   = $('qNumber');
const qDomain   = $('qDomain');
const qText     = $('qText');
const optArea   = $('optionsArea');
const feedback  = $('feedback');
const multiBadge= $('multiBadge');
const answeredBar= $('answeredBar');
const mainArea  = $('mainArea');
const resultsScreen = $('resultsScreen');

// ─── FILTER ─────────────────────────────────────────────────────────────────
function buildDomainButtons() {
  document.querySelectorAll('.domain-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.domain-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      state.filterDomain = btn.dataset.domain;
      state.current = 0;
      applyFilter();
      renderBar();
      renderQuestion();
    });
  });
}

function applyFilter() {
  if (state.filterDomain === 'all') {
    state.questions = DATA.questions;
  } else {
    state.questions = DATA.questions.filter(q => q.domain === state.filterDomain);
  }
}

function domainBtnCount(domain) {
  if (domain === 'all') return DATA.questions.length;
  return DATA.questions.filter(q => q.domain === domain).length;
}

// ─── RENDER ─────────────────────────────────────────────────────────────────
function renderQuestion() {
  if (state.questions.length === 0) {
    qText.textContent = 'No questions in this domain yet.';
    optArea.innerHTML = '';
    multiBadge.style.display = 'none';
    feedback.className = 'feedback';
    return;
  }

  const q = state.questions[state.current];
  const isMulti = q.correct.length > 1;
  const hasAnswered = state.answered[state.current] !== undefined;

  qNumber.textContent = `Q${state.current + 1}`;
  qDomain.textContent = q.domain;
  qText.textContent = q.question;
  multiBadge.style.display = isMulti ? 'inline' : 'none';

  // Build options
  optArea.innerHTML = '';
  q.options.forEach((opt, i) => {
    const div = document.createElement('div');
    div.className = 'option';
    div.dataset.idx = i;

    const letter = document.createElement('span');
    letter.className = 'letter';
    letter.textContent = opt.letter;

    const text = document.createElement('span');
    text.className = 'opt-text';
    text.textContent = opt.text;

    div.appendChild(letter);
    div.appendChild(text);

    if (hasAnswered) {
      div.classList.add('locked');
      if (state.answered[state.current] === 'correct') {
        if (q.correct.includes(i)) {
          div.classList.add('correct');
        } else {
          div.classList.add('wrong');
        }
      } else {
        if (q.correct.includes(i)) {
          div.classList.add('reveal-correct');
        } else {
          div.classList.add('locked');
        }
      }
    }

    div.addEventListener('click', () => handleAnswer(i, q, div));
    optArea.appendChild(div);
  });

  // Feedback
  if (hasAnswered) {
    const correct = state.answered[state.current] === 'correct';
    const correctOpts = q.options.filter((o, i) => q.correct.includes(i)).map(o => `${o.letter}) ${o.text}`).join('; ');
    feedback.innerHTML = correct
      ? `<strong>Correct!</strong> &nbsp;${correctOpts}`
      : `<strong>Incorrect.</strong> &nbsp;The correct answer${q.correct.length > 1 ? 's were' : ' was'}: ${correctOpts}`;
    feedback.className = `feedback show ${correct ? 'pass' : 'fail'}`;
  } else {
    feedback.className = 'feedback';
  }

  updateStats();
  updateNavButtons();
  renderBar();
}

function handleAnswer(selectedIdx, q, clickedDiv) {
  if (state.answered[state.current] !== undefined) return;

  const isCorrect = q.correct.includes(selectedIdx);
  const allCorrect = q.correct.every(ci => {
    const sel = optArea.querySelectorAll('.option');
    return sel[ci] && sel[ci].classList.contains('correct');
  });

  // Mark selected
  clickedDiv.classList.add(isCorrect ? 'correct' : 'wrong');

  // In practice mode, reveal correct answers on wrong selection
  if (!isCorrect && state.mode === 'practice') {
    q.correct.forEach(ci => {
      const opt = optArea.querySelectorAll('.option')[ci];
      if (opt && !opt.classList.contains('correct')) {
        opt.classList.add('reveal-correct');
      }
    });
  }

  // Lock all
  optArea.querySelectorAll('.option').forEach(o => o.classList.add('locked'));

  // In exam mode, wait before advancing
  if (isCorrect) {
    state.answered[state.current] = 'correct';
    state.correctCount++;
  } else {
    state.answered[state.current] = 'wrong';
    state.wrongCount++;
  }

  updateStats();
  renderBar();

  // Show feedback
  const correctOpts = q.options.filter((o, i) => q.correct.includes(i)).map(o => `${o.letter}) ${o.text}`).join('; ');
  feedback.innerHTML = isCorrect
    ? `<strong>Correct!</strong> &nbsp;${correctOpts}`
    : `<strong>Incorrect.</strong> &nbsp;The correct answer${q.correct.length > 1 ? 's were' : ' was'}: ${correctOpts}`;
  feedback.className = `feedback show ${isCorrect ? 'pass' : 'fail'}`;

  // In exam mode, auto-advance after 1.2s
  if (state.mode === 'exam' && isNextQuestionAvailable()) {
    setTimeout(() => nextQuestion(), 1200);
  }
}

// ─── STATS ───────────────────────────────────────────────────────────────────
function updateStats() {
  const total = state.correctCount + state.wrongCount;
  $('statTotalNum').textContent   = total;
  $('statCorrectNum').textContent = state.correctCount;
  $('statWrongNum').textContent   = state.wrongCount;
}

// ─── NAV ─────────────────────────────────────────────────────────────────────
function nextQuestion() {
  if (state.current < state.questions.length - 1) {
    state.current++;
    renderQuestion();
  } else if (state.mode === 'exam' && Object.keys(state.answered).length === state.questions.length) {
    showResults();
  }
}

function prevQuestion() {
  if (state.current > 0) {
    state.current--;
    renderQuestion();
  }
}

function updateNavButtons() {
  $('prevBtn').disabled = state.current === 0;
  const isLast = state.current === state.questions.length - 1;
  $('nextBtn').textContent = (isLast && state.mode === 'exam') ? 'See Results' : (isLast ? 'Finish' : 'Next →');
}

function isNextQuestionAvailable() {
  return state.current < state.questions.length - 1;
}

function goToQuestion(idx) {
  state.current = idx;
  renderQuestion();
  closeJump();
}

function isLastQuestionAnswered() {
  return state.answered[state.current] !== undefined;
}

// ─── BAR ─────────────────────────────────────────────────────────────────────
function renderBar() {
  answeredBar.innerHTML = '';
  state.questions.forEach((_, i) => {
    const dot = document.createElement('div');
    dot.className = 'dot';
    if (state.answered[i] === 'correct') dot.classList.add('answered-correct');
    else if (state.answered[i] === 'wrong') dot.classList.add('answered-wrong');
    if (i === state.current) dot.classList.add('current');
    dot.title = `Q${i + 1}`;
    dot.addEventListener('click', () => goToQuestion(i));
    answeredBar.appendChild(dot);
  });
}

// ─── MODE ────────────────────────────────────────────────────────────────────
function setupMode() {
  document.querySelectorAll('.mode-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      state.mode = btn.dataset.mode;
      if (state.mode === 'exam') {
        $('controlsBar').style.display = 'none';
        // Exam mode: disable prev/next until answered, no jumping
        $('jumpBtn').style.display = 'none';
      } else {
        $('controlsBar').style.display = 'flex';
        $('jumpBtn').style.display = 'inline-flex';
      }
      renderQuestion();
    });
  });
}

// ─── JUMP MODAL ──────────────────────────────────────────────────────────────
function openJump() {
  const grid = $('jumpGrid');
  grid.innerHTML = '';
  state.questions.forEach((_, i) => {
    const btn = document.createElement('button');
    btn.className = 'jn';
    btn.textContent = i + 1;
    if (state.answered[i] === 'correct') btn.classList.add('correct');
    else if (state.answered[i] === 'wrong') btn.classList.add('wrong');
    if (i === state.current) btn.classList.add('current');
    btn.addEventListener('click', () => goToQuestion(i));
    grid.appendChild(btn);
  });
  $('jumpModal').classList.add('open');
}

function closeJump() {
  $('jumpModal').classList.remove('open');
}

// ─── RESULTS ─────────────────────────────────────────────────────────────────
function showResults() {
  mainArea.style.display = 'none';
  resultsScreen.style.display = 'block';

  const total = state.questions.length;
  const correct = state.correctCount;
  const wrong = state.wrongCount;
  const skipped = total - correct - wrong;
  const pct = total > 0 ? Math.round((correct / total) * 100) : 0;
  const pass = pct >= 70;

  $('bigScore').textContent = pct + '%';
  $('bigScore').className = `big-score ${pass ? 'pass' : 'fail'}`;
  $('resultsTitle').textContent = pass ? 'Passed!' : 'Keep Practicing';
  $('scoreSub').textContent = `${correct} of ${total} correct — ${pct}%`;

  // Domain breakdown
  const domains = [...new Set(state.questions.map(q => q.domain))];
  $('resultsGrid').innerHTML = `
    <div class="res-card correct-card">
      <span class="rc-num">${correct}</span>
      <span class="rc-lbl">Correct</span>
    </div>
    <div class="res-card wrong-card">
      <span class="rc-num">${wrong}</span>
      <span class="rc-lbl">Wrong</span>
    </div>
    <div class="res-card skipped-card">
      <span class="rc-num">${skipped}</span>
      <span class="rc-lbl">Skipped</span>
    </div>
    <div class="res-card">
      <span class="rc-num">${total}</span>
      <span class="rc-lbl">Total</span>
    </div>
  `;
}

function restartQuiz() {
  state.current = 0;
  state.answered = {};
  state.correctCount = 0;
  state.wrongCount = 0;
  state.mode = 'practice';
  state.filterDomain = 'all';

  document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
  document.querySelector('.mode-btn[data-mode="practice"]').classList.add('active');
  document.querySelectorAll('.domain-btn').forEach(b => b.classList.remove('active'));
  document.querySelector('.domain-btn[data-domain="all"]').classList.add('active');

  $('controlsBar').style.display = 'flex';
  $('jumpBtn').style.display = 'inline-flex';
  mainArea.style.display = 'block';
  resultsScreen.style.display = 'none';

  applyFilter();
  updateStats();
  renderBar();
  renderQuestion();
}

// ─── EVENT LISTENERS ─────────────────────────────────────────────────────────
$('nextBtn').addEventListener('click', () => {
  if (state.mode === 'exam' && state.current === state.questions.length - 1) {
    showResults();
  } else {
    nextQuestion();
  }
});

$('prevBtn').addEventListener('click', prevQuestion);
$('jumpBtn').addEventListener('click', openJump);
$('jumpClose').addEventListener('click', closeJump);
$('restartBtn').addEventListener('click', restartQuiz);

$('jumpModal').addEventListener('click', e => {
  if (e.target === $('jumpModal')) closeJump();
});

document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight' || e.key === 'ArrowDown') nextQuestion();
  if (e.key === 'ArrowLeft'  || e.key === 'ArrowUp')   prevQuestion();
  if (e.key === 'Escape') closeJump();

  // Keyboard select options A/B/C/D
  if (!state.answered[state.current] && ['a','b','c','d','e'].includes(e.key.toLowerCase())) {
    const q = state.questions[state.current];
    const idx = q.options.findIndex(o => o.letter.toLowerCase() === e.key.toLowerCase());
    if (idx >= 0) {
      const div = optArea.querySelectorAll('.option')[idx];
      if (div) div.click();
    }
  }
});

init();
</script>
</body>
</html>
